services:
  ticketsystem-db:
    image: postgres:18.3
    container_name: ticketsystem-database
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ticketsystem-db}

volumes:
  pg_data: {}
